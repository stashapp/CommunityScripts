name: Visage
description: Use facial recognition to lookup performers from scene sprites
version: 2.12.0
url: https://discourse.stashapp.cc/t/visage/11785
# Read and written by src/services/stash.ts (getPluginSettings). Server wide.
settings:
  apiEndpoint:
    displayName: Visage Server URL
    description: Face recognition endpoint for all browsers. Leave empty for the Hugging Face cloud. The Visage settings dialog writes this value.
    type: STRING
ui:
  javascript:
  - visage.js
  css:
  - visage.css
  csp:
    connect-src:
    # Local backend default: http://localhost:7860
    # If your backend runs on another address (e.g. your LAN IP), add it below
    # or the browser CSP will block requests. Reapply after every Visage update.
    - "https://cc1234-stashface-onnx.hf.space"
    - "http://localhost:7860"
    # Example (uncomment and replace):
    # - "http://192.168.1.50:7860"
    script-src:
    - "'self'"
