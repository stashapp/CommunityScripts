name: scrollFeed
description: >
  A scrolling feed of your favorite marker clips, image clips and scene
  previews, designed for private one-handed mobile viewing. Works on the
  Markers, Images and Scenes walls. Just scroll for the next clip. Pairs
  with the preview-cap patch (linked) for clip-length playback.
