    description: "Tag all untagged images (WD tagger)"
    defaultArgs:
      target: images
      model: wd-v1-4-moat-tagger-v2
      mode: TagAll
      flag_tag: "AI_TagMe"
      add_tag: "AI_Tagged"
      tag_prefix: "AI: "
      debug_log: ""
      debug_floor: "0.05"
      debug_top: "10"
      tag_whitelist: ""
      tag_blacklist: ""
